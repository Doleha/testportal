<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Testing Portal - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #00b4db, #0083b0);
      color: #333;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .signup-box {
      background-color: #fff;
      border-radius: 10px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .signup-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .signup-header h2 {
      color: #0083b0;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.2rem rgba(0, 131, 176, 0.25);
    }
  </style>
</head>
<body>
  <div class="container d-flex align-items-center justify-content-center vh-100">
    <div class="signup-box w-100" style="max-width: 500px;">
      <div class="signup-header">
        <h2>Create an Account</h2>
        <p class="text-muted">Sign up to begin your journey</p>
      </div>
      <form id="signupForm">
        <div class="mb-3">
          <label for="firstName" class="form-label">First Name</label>
          <input type="text" class="form-control" id="firstName" required />
        </div>
        <div class="mb-3">
          <label for="lastName" class="form-label">Last Name</label>
          <input type="text" class="form-control" id="lastName" required />
        </div>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" required />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required />
        </div>
        <div class="mb-3">
          <label for="grade" class="form-label">Grade Level</label>
          <input type="text" class="form-control" id="grade" required />
        </div>
        <button type="submit" class="btn btn-success w-100">Sign Up</button>
        <div class="text-center mt-3">
          <small>Already have an account? <a href="/testportal/login.html">Login here</a></small>
        </div>
      </form>
    </div>
  </div>

<script>
  document.getElementById('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const payload = {
      action: 'register', // Pass the action to indicate this is a signup
      params: {
        first_name: document.getElementById('firstName').value,
        last_name: document.getElementById('lastName').value,
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        grade_level: document.getElementById('grade').value
      }
    };

    try {
      const res = await fetch('http://localhost:5678/webhook/frontend', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (data.success) {
        alert('Registration successful! Redirecting to login.');
        window.location.href = '/testportal/login.html';
      } else {
        alert(data.message || 'Registration failed.');
      }
    } catch (err) {
      console.error('Fetch or JSON parse error:', err);
      alert('Something went wrong. Please try again.');
    }
  });
</script>
</body>
</html>
